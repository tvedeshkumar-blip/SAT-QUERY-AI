services:
  - type: web
    name: satquery-backend
    env: python
    region: oregon
    plan: standard
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000
      - key: CORS_ORIGINS
        sync: false
      - key: DEVICE
        value: auto
      - key: GEMINI_API_KEY
        sync: false
